<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --link-color: #58a6ff;
            --header-bg: #161b22;
            --btn-bg: #21262d;
            --btn-border: rgba(240, 246, 252, 0.1);
            --btn-hover: #30363d;
            --btn-primary-bg: #238636;
            --btn-primary-hover: #2ea043;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
            --matrix-green: #39d353;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            line-height: 1.6;
            font-size: 16px;
        }

        a {
            color: var(--link-color);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        header {
            background-color: var(--header-bg);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header .logo {
            fill: var(--text-color);
        }

        .nav-links {
            display: flex;
            gap: 16px;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
        }

        .nav-links a:hover {
            color: var(--text-muted);
        }

        .container {
            max-width: 1012px;
            margin: 0 auto;
            padding: 0;
        }

        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            padding: 60px 0;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 48px;
            margin-bottom: 16px;
            letter-spacing: -1.5px;
        }

        .hero-text p {
            font-size: 20px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid;
            text-align: center;
        }

        .btn-primary {
            background-color: var(--btn-primary-bg);
            color: #ffffff;
            border-color: rgba(240, 246, 252, 0.1);
        }

        .btn-primary:hover {
            background-color: var(--btn-primary-hover);
            text-decoration: none;
        }

        .btn-secondary {
            background-color: var(--btn-bg);
            color: var(--text-color);
            border-color: var(--btn-border);
        }

        .btn-secondary:hover {
            background-color: var(--btn-hover);
            text-decoration: none;
        }

        .hero-actions {
            display: flex;
            gap: 12px;
        }

        .terminal-wrapper {
            flex: 1;
            background-color: #010409;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 16px 32px rgba(0,0,0,0.8);
        }

        .terminal-header {
            background-color: var(--header-bg);
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .term-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f56; }
        .dot-yellow { background-color: #ffbd2e; }
        .dot-green { background-color: #27c93f; }

        .terminal-body {
            padding: 24px;
            font-family: var(--font-mono);
            font-size: 14px;
            color: var(--matrix-green);
        }

        .prompt::before {
            content: "vovan@dev-server:~$ ";
            color: var(--link-color);
        }

        .typewriter {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid var(--matrix-green);
            width: 22ch;
            animation: typing 2s steps(22, end), blink-caret .75s step-end infinite;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0px 0 24px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title svg {
            fill: var(--text-muted);
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .repo-card {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            transition: border-color 0.2s ease;
        }

        .repo-card:hover {
            border-color: var(--text-muted);
        }

        .repo-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .repo-name {
            font-weight: 600;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .repo-name svg {
            fill: var(--text-muted);
        }

        .badge {
            border: 1px solid var(--border-color);
            border-radius: 2em;
            padding: 2px 8px;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .repo-desc {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            flex-grow: 1;
        }

        .repo-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lang-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 22ch }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: var(--matrix-green); }
        }

        @media (max-width: 768px) {
            .hero {
                flex-direction: column;
                padding: 40px 0;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            .terminal-wrapper {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="./" style="display: flex; align-items: center; text-decoration: none;">
                <svg height="32" viewBox="0 0 16 16" version="1.1" width="32" class="logo">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
            </a>
            <nav class="nav-links">
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <section class="hero" id="about">
            <div class="hero-text">
                <h1>Hi, I'm Volodimir</h1>
                <p>Software Engineer. Specializing in backend development, architecture, and automation. Building APIs and complex bots.</p>
                <div class="hero-actions">
                    <a href="projects.html" class="btn btn-primary">View Projects</a>
                    <a href="https://github.com/Vovan999222" target="_blank" class="btn btn-secondary">GitHub Profile</a>
                </div>
            </div>

            <div class="terminal-wrapper">
                <div class="terminal-header">
                    <div class="term-dot dot-red"></div>
                    <div class="term-dot dot-yellow"></div>
                    <div class="term-dot dot-green"></div>
                </div>
                <div class="terminal-body">
                    <div class="prompt"></div>
                    <div style="margin-bottom: 8px;">./get_status.sh</div>
                    <div>> OS: Ubuntu 25.04</div>
                    <div>> Status: Compiling code...</div>
                    <div class="prompt" style="margin-top: 16px;"></div>
                    <div class="typewriter">echo "Wake up, Neo..."</div>
                </div>
            </div>
        </section>

        <h2 class="section-title" id="projects">
            <svg viewBox="0 0 16 16" width="24" height="24"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path></svg>
            Featured Work
        </h2>

        <div class="projects-grid" id="projects-grid">
        </div>
    </div>
    <script>
        const githubUsername = 'Vovan999222';
        const apiUrl = `https://api.github.com/users/${githubUsername}/repos?sort=updated&per_page=4`;

        const languageColors = {
            "Python": "#3572A5",
            "Java": "#b07219",
            "Go": "#00ADD8",
            "C#": "#178600",
            "JavaScript": "#f1e05a",
            "HTML": "#e34c26",
            "CSS": "#563d7c",
            "C++": "#f34b7d"
        };

        async function fetchGitHubRepos() {
            const grid = document.getElementById('projects-grid');
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('Ошибка сети');
                const repos = await response.json();
                grid.innerHTML = '';

                repos.forEach(repo => {
                    const langColor = languageColors[repo.language] || "#8b949e";
                    const langText = repo.language || "Unknown";
                    const date = new Date(repo.updated_at).toLocaleDateString('en-US', {
                        month: 'short', day: 'numeric', year: 'numeric'
                    });

                    const cardHTML = `
                        <div class="repo-card">
                            <div class="repo-header">
                                <a href="${repo.html_url}" target="_blank" class="repo-name">
                                    <svg viewBox="0 0 16 16" width="16" height="16"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 014.5 0h8.75a.75.75 0 01.75.75v12.5a.75.75 0 01-.75.75h-2.5a.75.75 0 110-1.5h1.75v-2h-8a1 1 0 00-.714 1.7.75.75 0 01-1.072 1.05A2.495 2.495 0 012 11.5v-9zm10.5-1V9h-8c-.356 0-.694.074-1 .208V2.5a1 1 0 011-1h8zM5 12.25v3.25a.25.25 0 00.4.2l1.45-1.087a.25.25 0 01.3 0L8.6 15.7a.25.25 0 00.4-.2v-3.25a.25.25 0 00-.25-.25h-3.5a.25.25 0 00-.25.25z"></path></svg>
                                    ${repo.name}
                                </a>
                                <span class="badge">${repo.visibility === 'public' ? 'Public' : 'Private'}</span>
                            </div>
                            <div class="repo-desc">
                                ${repo.description ? repo.description : 'Описание отсутствует.'}
                            </div>
                            <div class="repo-meta">
                                <span><span class="lang-color" style="background-color: ${langColor};"></span>${langText}</span>
                                <span>⭐ ${repo.stargazers_count}</span>
                                <span>Updated ${date}</span>
                            </div>
                        </div>
                    `;
                    grid.insertAdjacentHTML('beforeend', cardHTML);
                });
                
            } catch (error) {
                console.error('Ошибка при загрузке репозиториев:', error);
            }
        }
        fetchGitHubRepos();
    </script>
    <script src="okak.js"></script>
    <script src="footer.js"></script>
    <script src="idk.js"></script>
</body>
</html>
